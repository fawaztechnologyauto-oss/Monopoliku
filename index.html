<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monopoly Indonesia Board Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        /* Responsive 1:1 Board Grid */
        .monopoly-board {
            display: grid;
            grid-template-columns: 1.6fr repeat(9, 1fr) 1.6fr;
            grid-template-rows: 1.6fr repeat(9, 1fr) 1.6fr;
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
        }

        /* Tile Text Scaling */
        .tile-text {
            font-size: clamp(6px, 1.3vw, 10px);
            line-height: 1.1;
        }

        .tile-price {
            font-size: clamp(5px, 1.1vw, 9px);
        }

        /* Player Tokens */
        .token {
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        /* Dice Roll Animation */
        @keyframes roll {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .rolling {
            animation: roll 0.4s ease-in-out infinite;
        }

        /* Custom Scrollbar for Controls */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col overflow-hidden select-none">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-building-columns text-red-500 text-xl"></i>
            <h1 class="font-extrabold text-base sm:text-lg tracking-wider bg-gradient-to-r from-red-500 to-amber-500 bg-clip-text text-transparent">
                MONOPOLI ID
            </h1>
        </div>
        <div id="turn-badge" class="px-3 py-1 bg-red-500/20 border border-red-500/50 rounded-full flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse" id="turn-dot"></span>
            <span class="text-xs font-bold text-red-400" id="turn-text">Giliran: Pemain 1</span>
        </div>
    </header>

    <!-- Main Container: Board Top, Controls Bottom -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden max-w-5xl w-full mx-auto">
        
        <!-- TOP: Perfect 1:1 Board Section -->
        <section class="w-full md:w-1/2 p-2 flex justify-center items-center shrink-0 max-h-[50vh] md:max-h-full">
            <div class="w-full max-w-[46vh] md:max-w-[85%] aspect-square bg-slate-800 rounded-xl p-1 shadow-2xl border border-slate-700/60 relative">
                
                <!-- Inner Monopoly Grid -->
                <div id="board" class="monopoly-board bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
                    <!-- Dynamic Tiles inserted by JS -->
                </div>

                <!-- Center Board Branding -->
                <div class="absolute inset-[15%] pointer-events-none flex flex-col items-center justify-center text-center">
                    <div class="opacity-15 flex flex-col items-center">
                        <i class="fa-solid fa-chess-board text-6xl sm:text-8xl text-slate-300"></i>
                        <span class="font-black text-xl sm:text-3xl tracking-widest text-slate-200 mt-2">INDONESIA BOARD</span>
                    </div>
                </div>

            </div>
        </section>

        <!-- BOTTOM: Control Panel & Stats (Scrollable) -->
        <section class="w-full md:w-1/2 flex flex-col flex-1 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 overflow-hidden">
            
            <!-- Tab Navigation Buttons -->
            <div class="flex border-b border-slate-800 bg-slate-950/50 text-xs sm:text-sm font-semibold">
                <button id="tab-btn-control" onclick="switchTab('control')" class="flex-1 py-2.5 text-center text-red-400 border-b-2 border-red-500 bg-slate-900">
                    <i class="fa-solid fa-gamepad mr-1"></i> Kontrol
                </button>
                <button id="tab-btn-portfolio" onclick="switchTab('portfolio')" class="flex-1 py-2.5 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200">
                    <i class="fa-solid fa-briefcase mr-1"></i> Portofolio
                </button>
                <button id="tab-btn-history" onclick="switchTab('history')" class="flex-1 py-2.5 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200">
                    <i class="fa-solid fa-clock-rotate-left mr-1"></i> Riwayat
                </button>
            </div>

            <!-- Tab Content Container -->
            <div class="flex-1 overflow-y-auto p-3 space-y-3">
                
                <!-- TAB 1: KONTROL -->
                <div id="tab-control" class="space-y-3">
                    <!-- Players Money Cards Grid -->
                    <div class="grid grid-cols-2 gap-2" id="players-card-container">
                        <!-- Rendered by JS -->
                    </div>

                    <!-- Dice Action Area -->
                    <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700 flex items-center justify-between">
                        <div class="flex space-x-3">
                            <div id="dice-1" class="w-12 h-12 bg-slate-100 rounded-lg text-slate-900 font-extrabold text-2xl flex items-center justify-center shadow-lg border-2 border-slate-300">
                                1
                            </div>
                            <div id="dice-2" class="w-12 h-12 bg-slate-100 rounded-lg text-slate-900 font-extrabold text-2xl flex items-center justify-center shadow-lg border-2 border-slate-300">
                                1
                            </div>
                        </div>

                        <div class="flex flex-col space-y-1">
                            <button id="btn-roll" onclick="rollDice()" class="px-6 py-2.5 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 font-bold text-sm text-white rounded-lg shadow-lg active:scale-95 transition">
                                <i class="fa-solid fa-dice mr-1"></i> Lempar Dadu
                            </button>
                            <button id="btn-buy" onclick="buyProperty()" disabled class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed font-bold text-xs text-white rounded-lg transition">
                                Beli Properti
                            </button>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: PORTOFOLIO -->
                <div id="tab-portfolio" class="hidden space-y-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Aset Milik Pemain</h3>
                    <div id="portfolio-list" class="space-y-2">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <!-- TAB 3: RIWAYAT -->
                <div id="tab-history" class="hidden space-y-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Catatan Permainan</h3>
                    <div id="history-log" class="bg-slate-950 p-3 rounded-lg border border-slate-800 font-mono text-xs text-slate-300 space-y-1.5 max-h-48 overflow-y-auto">
                        <p class="text-slate-500">▶ Permainan Dimulai. Selamat bermain!</p>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- JS Monopoly Engine -->
    <script>
        // --- DATA TILES (36 Petak Responsif 10x10 Perimeter) ---
        const boardTiles = [
            // Bawah (0-9: Start -> Malioboro)
            { id: 0, name: "START", type: "start", color: "bg-slate-200 text-slate-900", price: 0 },
            { id: 1, name: "Malioboro", type: "property", color: "bg-pink-600", price: 140, rent: 15, owner: null },
            { id: 2, name: "PLN", type: "utility", color: "bg-yellow-500 text-slate-900", price: 150, rent: 20, owner: null },
            { id: 3, name: "Prambanan", type: "property", color: "bg-pink-600", price: 140, rent: 15, owner: null },
            { id: 4, name: "Borobudur", type: "property", color: "bg-pink-600", price: 160, rent: 20, owner: null },
            { id: 5, name: "Stn. Gambir", type: "railroad", color: "bg-slate-700", price: 200, rent: 25, owner: null },
            { id: 6, name: "Kuta Bali", type: "property", color: "bg-orange-500", price: 180, rent: 22, owner: null },
            { id: 7, name: "Kesempatan", type: "chance", color: "bg-sky-500", price: 0 },
            { id: 8, name: "Ubud Bali", type: "property", color: "bg-orange-500", price: 180, rent: 22, owner: null },
            { id: 9, name: "Sanur Bali", type: "property", color: "bg-orange-500", price: 200, rent: 25, owner: null },

            // Kiri (10-18: Penjara -> Medan)
            { id: 10, name: "PENJARA", type: "jail", color: "bg-slate-300 text-slate-900", price: 0 },
            { id: 11, name: "Danau Toba", type: "property", color: "bg-red-600", price: 220, rent: 28, owner: null },
            { id: 12, name: "PDAM Water", type: "utility", color: "bg-cyan-500 text-slate-900", price: 150, rent: 20, owner: null },
            { id: 13, name: "Brastagi", type: "property", color: "bg-red-600", price: 220, rent: 28, owner: null },
            { id: 14, name: "Medan City", type: "property", color: "bg-red-600", price: 240, rent: 30, owner: null },
            { id: 15, name: "Stn. Bandung", type: "railroad", color: "bg-slate-700", price: 200, rent: 25, owner: null },
            { id: 16, name: "Lembang", type: "property", color: "bg-amber-400 text-slate-900", price: 260, rent: 32, owner: null },
            { id: 17, name: "Dana Umum", type: "chest", color: "bg-indigo-500", price: 0 },
            { id: 18, name: "Bandung", type: "property", color: "bg-amber-400 text-slate-900", price: 260, rent: 32, owner: null },

            // Atas (19-27: Parkir Gratis -> Raja Ampat)
            { id: 19, name: "PARKIR", type: "parking", color: "bg-slate-300 text-slate-900", price: 0 },
            { id: 20, name: "Surabaya", type: "property", color: "bg-emerald-600", price: 280, rent: 35, owner: null },
            { id: 21, name: "Kesempatan", type: "chance", color: "bg-sky-500", price: 0 },
            { id: 22, name: "Bromo", type: "property", color: "bg-emerald-600", price: 280, rent: 35, owner: null },
            { id: 23, name: "Stn. Surabaya", type: "railroad", color: "bg-slate-700", price: 200, rent: 25, owner: null },
            { id: 24, name: "Bunaken", type: "property", color: "bg-blue-600", price: 300, rent: 40, owner: null },
            { id: 25, name: "Makassar", type: "property", color: "bg-blue-600", price: 300, rent: 40, owner: null },
            { id: 26, name: "Telkomnet", type: "utility", color: "bg-red-500", price: 150, rent: 20, owner: null },
            { id: 27, name: "Raja Ampat", type: "property", color: "bg-blue-600", price: 320, rent: 45, owner: null },

            // Kanan (28-35: Masuk Penjara -> Monas)
            { id: 28, name: "KE PENJARA", type: "go_jail", color: "bg-slate-300 text-slate-900", price: 0 },
            { id: 29, name: "Jakarta SCBD", type: "property", color: "bg-purple-600", price: 350, rent: 50, owner: null },
            { id: 30, name: "Pajak Jalan", type: "tax", color: "bg-rose-700", price: 100 },
            { id: 31, name: "Menteng", type: "property", color: "bg-purple-600", price: 350, rent: 50, owner: null },
            { id: 32, name: "Bandara CGK", type: "railroad", color: "bg-slate-700", price: 200, rent: 25, owner: null },
            { id: 33, name: "Dana Umum", type: "chest", color: "bg-indigo-500", price: 0 },
            { id: 34, name: "IKN Nusantara", type: "property", color: "bg-yellow-400 text-slate-900", price: 400, rent: 60, owner: null },
            { id: 35, name: "Monas", type: "property", color: "bg-yellow-400 text-slate-900", price: 400, rent: 60, owner: null }
        ];

        // --- PLAYERS STATE ---
        const players = [
            { id: 0, name: "Pemain 1", color: "bg-red-500", border: "border-red-500", money: 1500, pos: 0, isBot: false, inJail: false },
            { id: 1, name: "Pemain 2", color: "bg-blue-500", border: "border-blue-500", money: 1500, pos: 0, isBot: true, inJail: false },
            { id: 2, name: "Pemain 3", color: "bg-emerald-500", border: "border-emerald-500", money: 1500, pos: 0, isBot: true, inJail: false },
            { id: 3, name: "Pemain 4", color: "bg-amber-500", border: "border-amber-500", money: 1500, pos: 0, isBot: true, inJail: false }
        ];

        let turn = 0;
        let isRolling = false;

        // --- GRID POSITION MAPPING FOR 10x10 BOARD PERIMETER ---
        function getGridStyle(index) {
            // Grid: 11x11 layout (Col 1-11, Row 1-11)
            // Bottom row: 0 to 9 -> Row 11, Col 11 down to 2
            if (index >= 0 && index <= 9) {
                return `grid-row: 11; grid-column: ${11 - index};`;
            }
            // Left col: 10 to 18 -> Col 1, Row 11 down to 3
            if (index >= 10 && index <= 18) {
                return `grid-column: 1; grid-row: ${11 - (index - 10)};`;
            }
            // Top row: 19 to 27 -> Row 1, Col 1 up to 10
            if (index >= 19 && index <= 27) {
                return `grid-row: 1; grid-column: ${1 + (index - 19)};`;
            }
            // Right col: 28 to 35 -> Col 11, Row 1 up to 9
            if (index >= 28 && index <= 35) {
                return `grid-column: 11; grid-row: ${1 + (index - 28)};`;
            }
            return "";
        }

        // --- INITIALIZE BOARD DOM ---
        function renderBoard() {
            const boardEl = document.getElementById("board");
            boardEl.innerHTML = "";

            boardTiles.forEach((tile, idx) => {
                const cell = document.createElement("div");
                cell.className = "relative bg-slate-800 border border-slate-700/70 flex flex-col justify-between overflow-hidden p-0.5 select-none";
                cell.style.cssText = getGridStyle(idx);
                cell.id = `tile-${idx}`;

                // Header Color Bar for Property
                let colorBar = "";
                if (tile.type === "property" || tile.type === "utility" || tile.type === "railroad") {
                    colorBar = `<div class="w-full h-1.5 sm:h-2 ${tile.color} rounded-sm mb-0.5 shrink-0"></div>`;
                }

                // Tile Text HTML
                cell.innerHTML = `
                    ${colorBar}
                    <div class="flex-1 flex flex-col items-center justify-center text-center px-0.5 leading-none">
                        <span class="font-bold text-slate-100 tile-text tracking-tighter truncate w-full">${tile.name}</span>
                        ${tile.price > 0 ? `<span class="text-slate-400 font-semibold tile-price mt-0.5">$${tile.price}</span>` : ""}
                    </div>
                    <!-- Player Tokens Container -->
                    <div id="tile-tokens-${idx}" class="absolute bottom-0.5 left-0 right-0 flex justify-center items-center space-x-0.5 z-10 pointer-events-none"></div>
                `;

                boardEl.appendChild(cell);
            });

            renderTokens();
            renderPlayersUI();
        }

        // --- RENDER PLAYER TOKENS ON BOARD ---
        function renderTokens() {
            // Clear existing tokens
            boardTiles.forEach((_, idx) => {
                const container = document.getElementById(`tile-tokens-${idx}`);
                if (container) container.innerHTML = "";
            });

            // Append tokens
            players.forEach(p => {
                const container = document.getElementById(`tile-tokens-${p.pos}`);
                if (container) {
                    const token = document.createElement("div");
                    token.className = `w-2.5 h-2.5 sm:w-3.5 sm:h-3.5 rounded-full ${p.color} border border-white font-black text-[7px] text-white flex items-center justify-center token`;
                    token.innerText = p.id + 1;
                    container.appendChild(token);
                }
            });
        }

        // --- RENDER PLAYER STATS UI ---
        function renderPlayersUI() {
            const container = document.getElementById("players-card-container");
            container.innerHTML = "";

            players.forEach((p, idx) => {
                const isCurrent = idx === turn;
                const card = document.createElement("div");
                card.className = `p-2.5 rounded-xl border transition-all ${isCurrent ? `${p.border} bg-slate-800/90 shadow-md ring-1 ring-slate-400` : "border-slate-800 bg-slate-950/60 opacity-80"}`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center space-x-1.5">
                            <span class="w-2.5 h-2.5 rounded-full ${p.color}"></span>
                            <span class="font-bold text-xs ${isCurrent ? "text-white" : "text-slate-400"}">${p.name}</span>
                        </div>
                        ${p.isBot ? `<span class="px-1.5 py-0.5 bg-slate-700 text-[9px] text-slate-300 font-mono rounded">BOT</span>` : ""}
                    </div>
                    <div class="text-base font-extrabold text-white tracking-tight">$${p.money}</div>
                    <div class="text-[10px] text-slate-400 mt-0.5 truncate">Pos: ${boardTiles[p.pos].name}</div>
                `;
                container.appendChild(card);
            });

            // Update Header Turn Badge
            const curP = players[turn];
            document.getElementById("turn-dot").className = `w-2.5 h-2.5 rounded-full ${curP.color} animate-pulse`;
            document.getElementById("turn-text").innerText = `Giliran: ${curP.name}`;

            // Button Disable State
            document.getElementById("btn-roll").disabled = isRolling || curP.isBot;
            updateBuyButton();
            renderPortfolio();
        }

        // --- ROLL DICE & MOVE ---
        function rollDice() {
            if (isRolling) return;
            isRolling = true;

            const p = players[turn];
            const d1El = document.getElementById("dice-1");
            const d2El = document.getElementById("dice-2");

            d1El.classList.add("rolling");
            d2El.classList.add("rolling");

            setTimeout(() => {
                d1El.classList.remove("rolling");
                d2El.classList.remove("rolling");

                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;

                d1El.innerText = d1;
                d2El.innerText = d2;

                const step = d1 + d2;
                logHistory(`${p.name} melempar dadu: **${d1} + ${d2} = ${step}**`);

                movePlayer(p, step);
            }, 500);
        }

        // --- MOVE PLAYER & HANDLE TILE LOGIC ---
        function movePlayer(player, steps) {
            let oldPos = player.pos;
            let newPos = (player.pos + steps) % boardTiles.length;

            // Lap bonus (Lewat START)
            if (newPos < oldPos) {
                player.money += 200;
                logHistory(`${player.name} melewati START dan mendapat bonus **+$200**!`);
            }

            player.pos = newPos;
            renderTokens();
            renderPlayersUI();

            const tile = boardTiles[newPos];
            logHistory(`${player.name} mendarat di **${tile.name}**`);

            // Tile Interactions
            setTimeout(() => {
                handleTileAction(player, tile);
            }, 400);
        }

        function handleTileAction(player, tile) {
            // Property / Utility / Railroad
            if (tile.price > 0 && tile.owner !== null && tile.owner !== player.id) {
                // Bayar Sewa
                const rent = tile.rent || 20;
                player.money -= rent;
                players[tile.owner].money += rent;
                logHistory(`${player.name} membayar sewa **$${rent}** kepada ${players[tile.owner].name}`);
            } else if (tile.type === "tax") {
                player.money -= tile.price;
                logHistory(`${player.name} membayar pajak **$${tile.price}**`);
            } else if (tile.type === "go_jail") {
                player.pos = 10;
                logHistory(`🚨 ${player.name} masuk ke Penjara!`);
                renderTokens();
            } else if (tile.type === "chance" || tile.type === "chest") {
                const bonus = (Math.floor(Math.random() * 5) + 1) * 20;
                player.money += bonus;
                logHistory(`🎁 ${player.name} mendapat hadiah kartu **+$${bonus}**`);
            }

            // BOT AI Logic for purchasing
            if (player.isBot) {
                if (tile.price > 0 && tile.owner === null && player.money >= tile.price) {
                    buyPropertyForPlayer(player, tile);
                }
                setTimeout(nextTurn, 1000);
            } else {
                isRolling = false;
                renderPlayersUI();
            }
        }

        // --- BUY PROPERTY ---
        function buyProperty() {
            const p = players[turn];
            const tile = boardTiles[p.pos];
            if (tile && tile.price > 0 && tile.owner === null && p.money >= tile.price) {
                buyPropertyForPlayer(p, tile);
                renderPlayersUI();
            }
        }

        function buyPropertyForPlayer(player, tile) {
            player.money -= tile.price;
            tile.owner = player.id;
            logHistory(`🏡 ${player.name} membeli **${tile.name}** seharga **$${tile.price}**`);
            renderPlayersUI();
        }

        function updateBuyButton() {
            const p = players[turn];
            const tile = boardTiles[p.pos];
            const btn = document.getElementById("btn-buy");

            if (!p.isBot && tile && tile.price > 0 && tile.owner === null && p.money >= tile.price) {
                btn.disabled = false;
                btn.className = "px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-lg shadow transition cursor-pointer";
            } else {
                btn.disabled = true;
                btn.className = "px-4 py-1.5 bg-slate-800 text-slate-500 disabled:opacity-40 disabled:cursor-not-allowed font-bold text-xs rounded-lg transition";
            }
        }

        // --- TURN MANAGEMENT ---
        function nextTurn() {
            turn = (turn + 1) % players.length;
            isRolling = false;
            renderPlayersUI();

            // Automatic BOT turn execution
            if (players[turn].isBot) {
                setTimeout(() => {
                    rollDice();
                }, 800);
            }
        }

        // --- PORTFOLIO TAB RENDER ---
        function renderPortfolio() {
            const list = document.getElementById("portfolio-list");
            list.innerHTML = "";

            players.forEach(p => {
                const pProps = boardTiles.filter(t => t.owner === p.id);
                const box = document.createElement("div");
                box.className = "p-2 bg-slate-800/60 rounded-lg border border-slate-700/50 text-xs";
                
                let propsHTML = pProps.length > 0 
                    ? pProps.map(t => `<span class="inline-block px-1.5 py-0.5 bg-slate-700 text-slate-200 rounded text-[10px] mr-1 mb-1">${t.name}</span>`).join('') 
                    : `<span class="text-slate-500 italic text-[10px]">Belum memiliki aset</span>`;

                box.innerHTML = `
                    <div class="flex items-center space-x-2 mb-1">
                        <span class="w-2 h-2 rounded-full ${p.color}"></span>
                        <span class="font-bold text-slate-200">${p.name}</span>
                        <span class="text-slate-400">(${pProps.length} Properti)</span>
                    </div>
                    <div class="flex flex-wrap">${propsHTML}</div>
                `;
                list.appendChild(box);
            });
        }

        // --- LOG HISTORY ---
        function logHistory(msg) {
            const log = document.getElementById("history-log");
            const entry = document.createElement("p");
            entry.innerHTML = `▶ ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // --- TAB SWITCHER ---
        function switchTab(tab) {
            ['control', 'portfolio', 'history'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add("hidden");
                const btn = document.getElementById(`tab-btn-${t}`);
                btn.className = "flex-1 py-2.5 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200";
            });

            document.getElementById(`tab-${tab}`).classList.remove("hidden");
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            activeBtn.className = "flex-1 py-2.5 text-center text-red-400 border-b-2 border-red-500 bg-slate-900 font-bold";
        }

        // --- INIT GAME ON LOAD ---
        window.onload = function() {
            renderBoard();
        };
    </script>
</body>
</html>
