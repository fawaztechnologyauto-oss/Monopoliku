        <div class="lg:col-span-7 w-full flex justify-center items-center overflow-x-auto py-2">
            <div class="monopoly-board relative" id="board">
                
                <!-- Panel Interaktif Tengah -->
                <div class="col-start-2 col-span-9 row-start-2 row-span-9 bg-slate-900/95 rounded-xl p-3 flex flex-col justify-between items-center text-center relative overflow-hidden border border-slate-800 backdrop-blur-md m-1">

                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-database text-emerald-400"></i> Sheet ID: <span class="font-mono text-slate-300">1XKAcb...AwJc4</span></span>

                    <!-- Kotak Giliran & Timer Hitung Mundur -->
                    <div class="my-auto w-full max-w-sm bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700 shadow-2xl relative z-10">
                        <p class="text-[11px] uppercase tracking-wider text-slate-400 font-bold mb-1">Giliran Saat Ini</p>
                        <h2 id="current-player-name" class="text-base font-black text-indigo-400 flex items-center justify-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> Pemain 1

                        <div class="mt-2 bg-slate-900 p-2 rounded-xl border border-slate-700/60">

                                <span id="timer-badge" class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-[11px]">10s</span>

                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">

                            </div>

                                Selesai
                            </button>
                        </div>
                    </div>

                    <div class="w-full flex justify-between items-center text-[10px] text-slate-500 pt-2 border-t border-slate-800/80">
                        <span id="sheet-status-text"><i class="fa-solid fa-cloud-arrow-up text-indigo-400"></i> AppsScript: Ready</span>
                        <span>Auto-Turn Active</span>
                    </div>
                </div>
            </div>
        </div>
