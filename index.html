<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monopoly Indonesia 3D Board Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            perspective: 1200px;
        }

        /* 3D Board Container Scene */
        .board-scene {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 3D Tilt Board */
        .monopoly-board-3d {
            display: grid;
            grid-template-columns: 1.6fr repeat(9, 1fr) 1.6fr;
            grid-template-rows: 1.6fr repeat(9, 1fr) 1.6fr;
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            transform: rotateX(35deg) rotateZ(0deg);
            transform-style: preserve-3d;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(239, 68, 68, 0.2);
            transition: transform 0.6s ease;
        }

        /* Tile Text Scaling */
        .tile-text {
            font-size: clamp(5px, 1.1vw, 9px);
            line-height: 1.1;
        }

        .tile-price {
            font-size: clamp(4px, 0.9vw, 8px);
        }

        /* 3D Property Building (House/Hotel) */
        .building-3d {
            position: absolute;
            top: -12px;
            right: 2px;
            width: 10px;
            height: 12px;
            transform: translateZ(15px);
            box-shadow: -2px 2px 4px rgba(0,0,0,0.5);
            animation: popUp 0.3s ease-out;
        }
        .building-3d::after {
            content: '';
            position: absolute;
            top: -5px;
            left: 0;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 6px solid currentColor;
        }

        @keyframes popUp {
            0% { transform: translateZ(0px) scale(0); }
            80% { transform: translateZ(20px) scale(1.1); }
            100% { transform: translateZ(15px) scale(1); }
        }

        /* Player Tokens 3D Pop */
        .token {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateZ(20px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }

        /* Dice Roll Animation */
        @keyframes roll {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .rolling {
            animation: roll 0.4s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col overflow-hidden select-none">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex justify-between items-center shrink-0 z-20">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-cube text-red-500 text-xl"></i>
            <h1 class="font-extrabold text-base sm:text-lg tracking-wider bg-gradient-to-r from-red-500 to-amber-500 bg-clip-text text-transparent">
                MONOPOLI ID 3D
            </h1>
        </div>
        <div class="flex items-center space-x-3">
            <div class="text-xs text-slate-400 hidden sm:block"><i class="fa-solid fa-camera text-amber-400 mr-1"></i> Kamera: <span id="camera-status" class="text-slate-200 font-semibold">Pemain 1</span></div>
            <div id="turn-badge" class="px-3 py-1 bg-red-500/20 border border-red-500/50 rounded-full flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse" id="turn-dot"></span>
                <span class="text-xs font-bold text-red-400" id="turn-text">Giliran: Pemain 1</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden max-w-6xl w-full mx-auto">
        
        <!-- TOP/LEFT: 3D Board Section -->
        <section class="w-full md:w-1/2 p-2 flex justify-center items-center shrink-0 max-h-[50vh] md:max-h-full">
            <div class="w-full max-w-[44vh] md:max-w-[85%] aspect-square relative perspective-container flex items-center justify-center">
                
                <!-- 3D Scene Wrapper with Dynamic Camera Rotation -->
                <div id="board-scene" class="board-scene">
                    <div id="board" class="monopoly-board-3d bg-slate-900 rounded-xl overflow-hidden border-4 border-slate-700">
                        <!-- Dynamic 3D Tiles inserted by JS -->
                    </div>
                </div>

                <!-- Center Board Branding Overlay -->
                <div class="absolute inset-[20%] pointer-events-none flex flex-col items-center justify-center text-center z-10">
                    <div class="opacity-20 flex flex-col items-center">
                        <i class="fa-solid fa-earth-asia text-5xl sm:text-7xl text-amber-400"></i>
                        <span class="font-black text-lg sm:text-2xl tracking-widest text-slate-200 mt-1">NUSANTARA 3D</span>
                    </div>
                </div>

            </div>
        </section>

        <!-- BOTTOM/RIGHT: Control Panel & Stats -->
        <section class="w-full md:w-1/2 flex flex-col flex-1 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 overflow-hidden z-20">
            
            <!-- Tab Navigation Buttons -->
            <div class="flex border-b border-slate-800 bg-slate-950/50 text-xs sm:text-sm font-semibold">
                <button id="tab-btn-control" onclick="switchTab('control')" class="flex-1 py-2.5 text-center text-red-400 border-b-2 border-red-500 bg-slate-900">
                    <i class="fa-solid fa-gamepad mr-1"></i> Kontrol
                </button>
                <button id="tab-btn-portfolio" onclick="switchTab('portfolio')" class="flex-1 py-2.5 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200">
                    <i class="fa-solid fa-briefcase mr-1"></i> Portofolio
                </button>
                <button id="tab-btn-history" onclick="switchTab('history')" class="flex-1 py-2.5 text-center text-slate-400 border-b-2 border-transparent hover:text-slate-200">
                    <i class="fa-solid fa-clock-rotate-left mr-1"></i> Riwayat
                </button>
            </div>

            <!-- Tab Content Container -->
            <div class="flex-1 overflow-y-auto p-3 space-y-3">
                
                <!-- TAB 1: KONTROL -->
                <div id="tab-control" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2" id="players-card-container">
                        <!-- Rendered by JS -->
                    </div>

                    <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700 flex items-center justify-between">
                        <div class="flex space-x-3">
                            <div id="dice-1" class="w-12 h-12 bg-slate-100 rounded-lg text-slate-900 font-extrabold text-2xl flex items-center justify-center shadow-lg border-2 border-slate-300">
                                1
                            </div>
                            <div id="dice-2" class="w-12 h-12 bg-slate-100 rounded-lg text-slate-900 font-extrabold text-2xl flex items-center justify-center shadow-lg border-2 border-slate-300">
                                1
                            </div>
                        </div>

                        <div class="flex flex-col space-y-1">
                            <button id="btn-roll" onclick="rollDice()" class="px-6 py-2.5 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 font-bold text-sm text-white rounded-lg shadow-lg active:scale-95 transition">
                                <i class="fa-solid fa-dice mr-1"></i> Lempar Dadu
                            </button>
                            <button id="btn-buy" onclick="buyProperty()" disabled class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed font-bold text-xs text-white rounded-lg transition">
                                Beli Properti
                            </button>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: PORTOFOLIO -->
                <div id="tab-portfolio" class="hidden space-y-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Aset & Bangunan Pemain</h3>
                    <div id="portfolio-list" class="space-y-2">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <!-- TAB 3: RIWAYAT -->
                <div id="tab-history" class="hidden space-y-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Catatan Permainan</h3>
                    <div id="history-log" class="bg-slate-950 p-3 rounded-lg border border-slate-800 font-mono text-xs text-slate-300 space-y-1.5 max-h-48 overflow-y-auto">
                        <p class="text-slate-500">▶ Permainan 3D Dimulai. Kamera mengikuti Pemain 1!</p>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- JS Monopoly Engine 3D -->
    <script>
        const boardTiles = [
            { id: 0, name: "START", type: "start", color: "bg-slate-200 text-slate-900", price: 0 },
            { id: 1, name: "Malioboro", type: "property", color: "bg-pink-600", price: 140, rent: 15, owner: null, houses: 0 },
            { id: 2, name: "PLN", type: "utility", color: "bg-yellow-500 text-slate-900", price: 150, rent: 20, owner: null },
            { id: 3, name: "Prambanan", type: "property", color: "bg-pink-600", price: 140, rent: 15, owner: null, houses: 0 },
            { id: 4, name: "Borobudur", type: "property", color: "bg-pink-600", price: 160, rent: 20, owner: null, houses: 0 },
            { id: 5, name: "Stn. Gambir", type: "railroad", color: "bg-slate-700", price: 200, rent: 25, owner: null },
            { id: 6, name: "Kuta Bali", type: "property", color: "bg-orange-500", price: 180, rent: 22, owner: null, houses: 0 },
            { id: 7, name: "Kesempatan", type: "chance", color: "bg-sky-500", price: 0 },
            { id: 8, name: "Ubud Bali", type: "property", color: "bg-orange-500", price: 180, rent: 22, owner: null, houses: 0 },
            { id: 9, name: "Sanur Bali", type: "property", color: "bg-orange-500", price: 200, rent: 25, owner: null, houses: 0 },

            { id: 10, name: "PENJARA", type: "jail", color: "bg-slate-300 text-slate-900", price: 0 },
            { id: 11, name: "Danau Toba", type: "property", color: "bg-red-600", price: 220, rent: 28, owner: null, houses: 0 },
            { id: 12, name: "PDAM Water", type: "utility", color: "bg-cyan-500 text-slate-900", price: 150, rent: 20, owner: null },
            { id: 13, name: "Brastagi", type: "property", color: "bg-red-600", price: 220, rent: 28, owner: null, houses: 0 },
            { id: 14, name: "Medan City", type: "property", color: "bg-red-600", price: 240, rent: 30, owner: null, houses: 0 },
            { id: 15, name: "Stn. Bandung", type: "railroad", color: "bg-slate-700", price: 200, rent: 25, owner: null },
            { id: 16, name: "Lembang", type: "property", color: "bg-amber-400 text-slate-900", price: 260, rent: 32, owner: null, houses: 0 },
            { id: 17, name: "Dana Umum", type: "chest", color: "bg-indigo-500", price: 0 },
            { id: 18, name: "Bandung", type: "property", color: "bg-amber-400 text-slate-900", price: 260, rent: 32, owner: null, houses: 0 },

            { id: 19, name: "PARKIR", type: "parking", color: "bg-slate-300 text-slate-900", price: 0 },
            { id: 20, name: "Surabaya", type: "property", color: "bg-emerald-600", price: 280, rent: 35, owner: null, houses: 0 },
            { id: 21, name: "Kesempatan", type: "chance", color: "bg-sky-500", price: 0 },
            { id: 22, name: "Bromo", type: "property", color: "bg-emerald-600", price: 280, rent: 35, owner: null, houses: 0 },
            { id: 23, name: "Stn. Surabaya", type: "railroad", color: "bg-slate-700", price: 200, rent: 25, owner: null },
            { id: 24, name: "Bunaken", type: "property", color: "bg-blue-600", price: 300, rent: 40, owner: null, houses: 0 },
            { id: 25, name: "Makassar", type: "property", color: "bg-blue-600", price: 300, rent: 40, owner: null, houses: 0 },
            { id: 26, name: "Telkomnet", type: "utility", color: "bg-red-500", price: 150, rent: 20, owner: null },
            { id: 27, name: "Raja Ampat", type: "property", color: "bg-blue-600", price: 320, rent: 45, owner: null, houses: 0 },

            { id: 28, name: "KE PENJARA", type: "go_jail", color: "bg-slate-300 text-slate-900", price: 0 },
            { id: 29, name: "Jakarta SCBD", type: "property", color: "bg-purple-600", price: 350, rent: 50, owner: null, houses: 0 },
            { id: 30, name: "Pajak Jalan", type: "tax", color: "bg-rose-700", price: 100 },
            { id: 31, name: "Menteng", type: "property", color: "bg-purple-600", price: 350, rent: 50, owner: null, houses: 0 },
            { id: 32, name: "Bandara CGK", type: "railroad", color: "bg-slate-700", price: 200, rent: 25, owner: null },
            { id: 33, name: "Dana Umum", type: "chest", color: "bg-indigo-500", price: 0 },
            { id: 34, name: "IKN Nusantara", type: "property", color: "bg-yellow-400 text-slate-900", price: 400, rent: 60, owner: null, houses: 0 },
            { id: 35, name: "Monas", type: "property", color: "bg-yellow-400 text-slate-900", price: 400, rent: 60, owner: null, houses: 0 }
        ];

        const players = [
            { id: 0, name: "Pemain 1", color: "bg-red-500", hexColor: "#ef4444", border: "border-red-500", money: 1500, pos: 0, isBot: false },
            { id: 1, name: "Pemain 2", color: "bg-blue-500", hexColor: "#3b82f6", border: "border-blue-500", money: 1500, pos: 0, isBot: true },
            { id: 2, name: "Pemain 3", color: "bg-emerald-500", hexColor: "#10b981", border: "border-emerald-500", money: 1500, pos: 0, isBot: true },
            { id: 3, name: "Pemain 4", color: "bg-amber-500", hexColor: "#f59e0b", border: "border-amber-500", money: 1500, pos: 0, isBot: true }
        ];

        let turn = 0;
        let isRolling = false;

        function getGridStyle(index) {
            if (index >= 0 && index <= 9) return `grid-row: 11; grid-column: ${11 - index};`;
            if (index >= 10 && index <= 18) return `grid-column: 1; grid-row: ${11 - (index - 10)};`;
            if (index >= 19 && index <= 27) return `grid-row: 1; grid-column: ${1 + (index - 19)};`;
            if (index >= 28 && index <= 35) return `grid-column: 11; grid-row: ${1 + (index - 28)};`;
            return "";
        }

        function renderBoard() {
            const boardEl = document.getElementById("board");
            boardEl.innerHTML = "";

            boardTiles.forEach((tile, idx) => {
                const cell = document.createElement("div");
                cell.className = "relative bg-slate-800 border border-slate-700/70 flex flex-col justify-between overflow-visible p-0.5 select-none";
                cell.style.cssText = getGridStyle(idx);
                cell.id = `tile-${idx}`;

                let colorBar = "";
                if (tile.type === "property" || tile.type === "utility" || tile.type === "railroad") {
                    colorBar = `<div class="w-full h-1.5 sm:h-2 ${tile.color} rounded-sm mb-0.5 shrink-0"></div>`;
                }

                // 3D Building rendering if owned
                let buildingHTML = "";
                if (tile.owner !== null && tile.houses > 0) {
                    const ownerObj = players.find(p => p.id === tile.owner);
                    buildingHTML = `<div class="building-3d" style="color: ${ownerObj ? ownerObj.hexColor : '#fff'};" title="Rumah Pemilik: ${ownerObj ? ownerObj.name : ''}"></div>`;
                }

                cell.innerHTML = `
                    ${colorBar}
                    <div class="flex-1 flex flex-col items-center justify-center text-center px-0.5 leading-none relative">
                        ${buildingHTML}
                        <span class="font-bold text-slate-100 tile-text tracking-tighter truncate w-full">${tile.name}</span>
                        ${tile.price > 0 ? `<span class="text-slate-400 font-semibold tile-price mt-0.5">$${tile.price}</span>` : ""}
                    </div>
                    <div id="tile-tokens-${idx}" class="absolute bottom-0.5 left-0 right-0 flex justify-center items-center space-x-0.5 z-20 pointer-events-none"></div>
                `;

                boardEl.appendChild(cell);
            });

            renderTokens();
            renderPlayersUI();
            updateCameraView();
        }

        // --- DYNAMIC 3D CAMERA FOLLOW PLAYER 1 (OR CURRENT HUMAN/ACTIVE PLAYER) ---
        function updateCameraView() {
            // Kamera berotasi agar berfokus atau menghadap ke kuadran tempat Pemain 1 berada
            const p1 = players[0];
            const scene = document.getElementById("board-scene");
            
            // Hitung sudut rotasi berdasarkan posisi petak pemain utama (Pemain 1)
            let rotateZAngle = 0;
            if (p1.pos >= 10 && p1.pos < 19) rotateZAngle = -90;
            else if (p1.pos >= 19 && p1.pos < 28) rotateZAngle = -180;
            else if (p1.pos >= 28) rotateZAngle = -270;

            scene.style.transform = `rotateZ(${rotateZAngle}deg)`;
            document.getElementById("camera-status").innerText = `${p1.name} (Petak ${p1.pos})`;
        }

        function renderTokens() {
            boardTiles.forEach((_, idx) => {
                const container = document.getElementById(`tile-tokens-${idx}`);
                if (container) container.innerHTML = "";
            });

            players.forEach(p => {
                const container = document.getElementById(`tile-tokens-${p.pos}`);
                if (container) {
                    const token = document.createElement("div");
                    token.className = `w-2.5 h-2.5 sm:w-3.5 sm:h-3.5 rounded-full ${p.color} border-2 border-white font-black text-[7px] text-white flex items-center justify-center token`;
                    token.innerText = p.id + 1;
                    container.appendChild(token);
                }
            });
        }

        function renderPlayersUI() {
            const container = document.getElementById("players-card-container");
            container.innerHTML = "";

            players.forEach((p, idx) => {
                const isCurrent = idx === turn;
                const card = document.createElement("div");
                card.className = `p-2.5 rounded-xl border transition-all ${isCurrent ? `${p.border} bg-slate-800/90 shadow-md ring-1 ring-slate-400` : "border-slate-800 bg-slate-950/60 opacity-80"}`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center space-x-1.5">
                            <span class="w-2.5 h-2.5 rounded-full ${p.color}"></span>
                            <span class="font-bold text-xs ${isCurrent ? "text-white" : "text-slate-400"}">${p.name}</span>
                        </div>
                        ${p.isBot ? `<span class="px-1.5 py-0.5 bg-slate-700 text-[9px] text-slate-300 font-mono rounded">BOT</span>` : ""}
                    </div>
                    <div class="text-base font-extrabold text-white tracking-tight">$${p.money}</div>
                    <div class="text-[10px] text-slate-400 mt-0.5 truncate">Pos: ${boardTiles[p.pos].name}</div>
                `;
                container.appendChild(card);
            });

            const curP = players[turn];
            document.getElementById("turn-dot").className = `w-2.5 h-2.5 rounded-full ${curP.color} animate-pulse`;
            document.getElementById("turn-text").innerText = `Giliran: ${curP.name}`;

            document.getElementById("btn-roll").disabled = isRolling || curP.isBot;
            updateBuyButton();
            renderPortfolio();
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;

            const p = players[turn];
            const d1El = document.getElementById("dice-1");
            const d2El = document.getElementById("dice-2");

            d1El.classList.add("rolling");
            d2El.classList.add("rolling");

            setTimeout(() => {
                d1El.classList.remove("rolling");
                d2El.classList.remove("rolling");

                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;

                d1El.innerText = d1;
                d2El.innerText = d2;

                const step = d1 + d2;
                logHistory(`${p.name} melempar dadu: ${d1} & ${d2} (Total: ${step})`);

                movePlayer(p, step);
            }, 500);
        }

        function movePlayer(p, step) {
            let oldPos = p.pos;
            p.pos = (p.pos + step) % boardTiles.length;

            if (p.pos < oldPos) {
                p.money += 200;
                logHistory(`💰 ${p.name} melewati START dan menerima $200!`);
            }

            renderTokens();
            updateCameraView();
            handleTileAction(p);
        }

        function handleTileAction(p) {
            const tile = boardTiles[p.pos];
            logHistory(`${p.name} mendarat di ${tile.name}`);

            if (tile.type === "property" || tile.type === "utility" || tile.type === "railroad") {
                if (tile.owner === null) {
                    if (!p.isBot) {
                        logHistory(`💡 ${tile.name} tersedia seharga $${tile.price}. Anda dapat membelinya.`);
                    } else {
                        if (p.money >= tile.price && Math.random() > 0.3) {
                            p.money -= tile.price;
                            tile.owner = p.id;
                            tile.houses = 1; // otomatis bangun 1 rumah 3D
                            logHistory(`🤖 ${p.name} membeli ${tile.name} dan membangun 1 Rumah 3D!`);
                            renderBoard();
                        }
                    }
                } else if (tile.owner !== p.id) {
                    const owner = players.find(x => x.id === tile.owner);
                    const rentFee = tile.rent * (tile.houses > 0 ? tile.houses : 1);
                    p.money -= rentFee;
                    owner.money += rentFee;
                    logHistory(`💸 ${p.name} membayar sewa $${rentFee} kepada ${owner.name} di ${tile.name}`);
                }
            } else if (tile.type === "tax") {
                p.money -= tile.price;
                logHistory(`🏛️ ${p.name} membayar Pajak Jalan sebesar $${tile.price}`);
            } else if (tile.type === "go_jail") {
                p.pos = 10; // Masuk Penjara
                logHistory(`🚨 ${p.name} ditangkap dan masuk Petak Penjara!`);
            }

            renderPlayersUI();
            isRolling = false;

            if (!isGameOver()) {
                setTimeout(nextTurn, 1200);
            }
        }

        function buyProperty() {
            const p = players[turn];
            const tile = boardTiles[p.pos];

            if (tile.type && (tile.type === "property" || tile.type === "utility" || tile.type === "railroad") && tile.owner === null) {
                if (p.money >= tile.price) {
                    p.money -= tile.price;
                    tile.owner = p.id;
                    tile.houses = 1; // Bangun 1 rumah 3D warna pion
                    logHistory(`✅ ${p.name} sukses membeli ${tile.name} dan mendirikan Rumah 3D!`);
                    renderBoard();
                    updateBuyButton();
                } else {
                    alert("Uang Anda tidak cukup untuk membeli properti ini!");
                }
            }
        }

        function updateBuyButton() {
            const p = players[turn];
            const tile = boardTiles[p.pos];
            const btnBuy = document.getElementById("btn-buy");

            if (!p.isBot && tile.type && (tile.type === "property" || tile.type === "utility" || tile.type === "railroad") && tile.owner === null) {
                btnBuy.disabled = p.money < tile.price;
            } else {
                btnBuy.disabled = true;
            }
        }

        function nextTurn() {
            turn = (turn + 1) % players.length;
            renderPlayersUI();

            if (players[turn].isBot) {
                setTimeout(rollDice, 1000);
            }
        }

        function isGameOver() {
            const bankrupt = players.filter(p => p.money < 0);
            if (bankrupt.length > 0) {
                logHistory(`🏁 Permainan Selesai! Pemain bangkrut.`);
                return true;
            }
            return false;
        }

        function renderPortfolio() {
            const listEl = document.getElementById("portfolio-list");
            listEl.innerHTML = "";

            players.forEach(p => {
                const owned = boardTiles.filter(t => t.owner === p.id);
                const div = document.createElement("div");
                div.className = "bg-slate-950 p-2 rounded-lg border border-slate-800 text-xs";
                
                let assetsHtml = owned.length > 0 
                    ? owned.map(t => `<span class="px-1.5 py-0.5 bg-slate-800 rounded mr-1 inline-block mb-1 text-[10px] text-amber-300">🏠 ${t.name} (Rumah: ${t.houses})</span>`).join("")
                    : `<span class="text-slate-600 italic">Belum memiliki aset</span>`;

                div.innerHTML = `
                    <div class="font-bold text-slate-300 mb-1 flex items-center space-x-1">
                        <span class="w-2 h-2 rounded-full ${p.color}"></span>
                        <span>${p.name}</span>
                    </div>
                    <div class="flex flex-wrap">${assetsHtml}</div>
                `;
                listEl.appendChild(div);
            });
        }

        function logHistory(msg) {
            const logEl = document.getElementById("history-log");
            const p = document.createElement("p");
            p.innerText = `> ${msg}`;
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function switchTab(tab) {
            document.getElementById("tab-control").classList.add("hidden");
            document.getElementById("tab-portfolio").classList.add("hidden");
            document.getElementById("tab-history").classList.add("hidden");

            document.getElementById("tab-btn-control").className = "flex-1 py-2.5 text-center text-slate-400 border-b-2 border-transparent";
            document.getElementById("tab-btn-portfolio").className = "flex-1 py-2.5 text-center text-slate-400 border-b-2 border-transparent";
            document.getElementById("tab-btn-history").className = "flex-1 py-2.5 text-center text-slate-400 border-b-2 border-transparent";

            document.getElementById(`tab-${tab}`).classList.remove("hidden");
            document.getElementById(`tab-btn-${tab}`).className = "flex-1 py-2.5 text-center text-red-400 border-b-2 border-red-500 bg-slate-900";
        }

        // Inisialisasi awal papan
        renderBoard();
    </script>
</body>
</html>
